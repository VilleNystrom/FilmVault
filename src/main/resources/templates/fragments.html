<!DOCTYPE html>
<html lang="fi" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="site-header">
    <a class="brand" th:href="@{/elokuvat}">🎬 MovieManager</a>
    <nav>
        <a th:href="@{/elokuvat}">Elokuvat</a>
        <a th:href="@{/admin}" sec:authorize="hasRole('ADMIN')">Ylläpito</a>
        <a th:href="@{/login}" sec:authorize="!isAuthenticated()">Kirjaudu</a>
        <form th:action="@{/logout}" method="post" class="inline-form" sec:authorize="isAuthenticated()">
            <button class="nav-button" type="submit">Kirjaudu ulos</button>
        </form>
    </nav>
</header>
</body>
</html>
