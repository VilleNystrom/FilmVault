spring.application.nimi=MovieManager

# H2-tiedosto säilyttää tiedot sovelluksen uudelleenkäynnistyksen jälkeen.
spring.datasource.url=jdbc:h2:file:./data/moviemanager;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-nimi=org.h2.Driver
spring.datasource.kayttajatunnus=sa
spring.datasource.salasana=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false
server.error.include-message=always
